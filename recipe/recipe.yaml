context:
  name: toppra
  version: "0.6.10"

recipe:
  name: toppra
  version: ${{ version }}

source:
  url: https://github.com/hungpham2511/toppra/archive/refs/tags/${{ version }}.tar.gz
  sha256: bf3f9794dea87890453e6e3ffaf4213bddf68f494e6091e7b04dba7b224e67d5

build:
  number: 1

outputs:
  - package:
      name: libtoppra
      version: ${{ version }}
    build:
      script:
        - if: unix
          then: build.sh
        - if: win
          then: build.bat
    requirements:
      run_exports:
        - ${{ pin_subpackage("libtoppra", upper_bound="x.x.x") }}
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
      host:
        - eigen-abi-devel
        - gtest
      run:
        - eigen-abi-devel
      ignore_run_exports:
        by_name:
          - gtest
        from_package:
          - gtest
    tests:
      - package_contents:
          lib:
            - toppra

  - package:
      name: toppra-python
      version: ${{ version }}
    build:
      script:
        file: build
        env:
          PYTHON_BINDINGS: "ON"
      # The build reinstalls the C++ library into the prefix; only package the
      # Python module and let libtoppra provide everything else at runtime.
      files:
        - lib/python*/site-packages/**
        - Lib/site-packages/**
    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
        - if: build_platform != target_platform
          then:
            - python
            - cross-python_${{ target_platform }}
            - pybind11
      host:
        - ${{ pin_subpackage("libtoppra", exact=True) }}
        - eigen-abi-devel
        - python
        - pybind11
      run:
        - python
        - numpy
    tests:
      - python:
          imports:
            - toppra_int
          pip_check: false

about:
  homepage: https://github.com/hungpham2511/toppra
  license: MIT
  license_file: LICENSE
  summary: Path parameterization for robots
  repository: https://github.com/hungpham2511/toppra
  documentation: https://hungpham2511.github.io/toppra/index.html

extra:
  feedstock-name: toppra
  recipe-maintainers:
    - sea-bass
